name: Market scan

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may start runs a few minutes late)
  workflow_dispatch:          # "Run workflow" button for a manual scan
  push:
    branches: [main]          # scan straight away with newly pushed settings

# Never run two scans at once - they'd share state and could double-send alerts.
concurrency:
  group: market-scan
  cancel-in-progress: false

permissions:
  contents: write   # only used by the keep-alive step below

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Bring back the database from the previous run (buckets + alerts already sent).
      - name: Restore state
        uses: actions/cache/restore@v6
        with:
          path: data/watcher.db
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Scan and alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python run_once.py

      - name: Save state
        if: always() && hashFiles('data/watcher.db') != ''
        uses: actions/cache/save@v6
        with:
          path: data/watcher.db
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      # GitHub switches off schedules in public repos with no commits for 60 days.
      # If the last commit is 50+ days old, make a tiny one to keep scans running.
      - name: Keep schedule alive
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -gt $((50 * 86400)) ]; then
            date -u +%FT%TZ > .github/keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive
            git commit -m "Keep scheduled scans alive"
            git push
          fi
